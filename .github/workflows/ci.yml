name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test -- --run --coverage

      - name: Build
        run: pnpm build

      - name: Verify dist is fresh
        run: |
          git diff --exit-code dist/ || \
            (echo "::error::dist/ is outdated. Run 'pnpm build' and commit." && exit 1)
