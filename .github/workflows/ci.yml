name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Type Check
        run: pnpm run lint

      - name: Run Unit Tests
        run: pnpm exec vitest run

      - name: Verify Build Integrity
        run: |
          pnpm run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "❌ The production bundle in 'dist/' is out of sync with the source files in 'src/'."
            echo "Please run 'pnpm run build' locally and commit the modified bundle."
            git diff dist/
            exit 1
          fi
          echo "✅ Production bundle is fully synchronized and up to date!"
