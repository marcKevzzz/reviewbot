name: Dogfood
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ReviewBot Self-Review
        uses: ./
        with:
          ai-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          provider: "gemini"
          severity-threshold: "info"
          max-findings: "15"
